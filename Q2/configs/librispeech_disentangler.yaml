# Configuration for LibriSpeech-based AE-Disentangler
# Paper's method applied to LibriSpeech dataset

model:
  type: "disentangler_ae"

  # Base encoder
  encoder:
    type: "tdnn"
    embedding_dim: 256
    feat_dim: 80

  # Disentangler
  disentangler:
    type: "autoencoder"
    latent_dim: 256
    component_dim: 128  # latent_dim // 2

  # Discriminators
  discriminators:
    speaker:
      type: "linear"
      hidden_dim: null
    environment:
      type: "mlp"
      hidden_dim: 512
    num_envs: 600  # LibriSpeech train-clean-100 has 585 unique chapters

data:
  dataset: "librispeech"
  train_root: "./data"
  subset: "train-clean-100"

  # Batch construction
  batch_size: 128
  num_workers: 4
  num_utterances_per_speaker: 2
  num_speakers_per_batch: 50

  # Feature extraction
  sample_rate: 16000
  n_mels: 80
  n_fft: 1024
  hop_length: 160
  num_frames: 300

augmentation:
  enabled: false

training:
  # Two-phase training
  pretrain_epochs: 20  # Phase 1: speaker loss only
  max_epochs: 10      # Phase 2: full joint training

  warmup_epochs: 5

  # Optimization
  optimizer:
    type: "adamw"
    lr: 0.0001
    weight_decay: 1.0e-5

  scheduler:
    type: "cosine"
    T_max: 100
    eta_min: 0.00001

  # Loss weights (Equation 4 in paper)
  losses:
    L_spk: 1.0           # Speaker identification loss
    L_recons: 1.0        # Reconstruction loss
    L_env_env: 1.0       # Environment discriminator loss on env code
    L_env_spk: 0.5       # Environment discriminator loss on speaker code (with GRL)
    L_corr: 1.0          # Correlation minimization loss

  grl_lambda: 0.5       # Gradient reversal strength

  # Checkpointing
  checkpoint_dir: "checkpoints/librispeech_disentangler_ae"
  save_interval: 10
  eval_interval: 1

device: "cuda"
random_seed: 42
verbose: true
