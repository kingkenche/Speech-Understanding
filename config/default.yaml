# Default Configuration for Speech Assignment 2

# Data Paths
data:
  raw_video_path: "data/raw/lecture_video/"
  audio_dir: "data/audio/"
  processed_dir: "data/processed/"
  corpus_dir: "data/corpus/"
  original_segment: "data/audio/original_segment.wav"
  student_voice_ref: "data/audio/student_voice_ref.wav"
  output_cloned: "data/audio/output_LRL_cloned.wav"

# Model Paths
models:
  pretrained_dir: "models/pretrained/"
  custom_dir: "models/custom/"
  whisper_model: "openai/whisper-large-v3"
  wav2vec2_model: "facebook/wav2vec2-base"
  speaker_encoder: "speechbrain/speaker-recognition-ecapa-voxceleb"
  vits_model: "facebook/mms-tts-eng"
  deepfilter_model: "deepfilter/df_lightning_15h"

# Audio Processing
audio:
  sample_rate: 16000
  target_sr: 22050
  n_mels: 80
  n_fft: 400
  hop_length: 160
  win_length: 400
  segment_duration: 600  # 10 minutes in seconds
  frame_shift_ms: 20

# Language Identification (Task 1.1)
lid:
  target_f1_score: 0.85
  languages: ["en", "hi"]
  frame_level: true

# Speech Enhancement (Task 1.3)
denoising:
  use_deepfilter: true
  alternative: "spectral_subtraction"
  noise_profile: null

# N-gram Language Model (Task 1.2)
ngram_lm:
  order: 3
  output_path: "data/corpus/ngram_lm.arpa"
  syllabus_corpus: "data/corpus/speech_syllabus.txt"

# Voice Cloning (Task 3)
tts:
  target_language: "gondi"
  speaker_embedding_dim: 256
  prosody_warping: true
  dtw_enabled: true

# Anti-Spoofing Classifier (Task 4.1)
antispoof:
  feature_type: "lfcc"
  classifier_type: "svm"  # or "nn", "gmm"
  target_eer: 0.10

# Adversarial Robustness (Task 4.2)
adversarial:
  method: "fgsm"
  min_snr_db: 40.0
  epsilon_start: 0.001
  epsilon_max: 0.1
  epsilon_step: 0.001

# Evaluation
evaluation:
  wer_threshold_en: 0.15
  wer_threshold_hi: 0.25
  mcd_threshold: 8.0
  lid_switch_tolerance_ms: 200
  eer_threshold: 0.10

# Training
training:
  batch_size: 16
  num_epochs: 10
  learning_rate: 1e-4
  device: "cuda"
  num_gpus: 1
  mixed_precision: true
  checkpoint_dir: "checkpoints/"

# Paths specific to outputs
output:
  transcripts_dir: "data/processed/transcripts/"
  embeddings_dir: "data/processed/embeddings/"
  models_dir: "models/custom/"
  report_dir: "report/"
